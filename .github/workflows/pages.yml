name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x scripts/build-themes.sh

      - name: Compile All Themes
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: src
          root_file: resume.tex
          compiler: bash
          args: ../scripts/build-themes.sh

      - name: Verify PDF Generation
        run: |
          for theme in minimal classic modern; do
            FILE="output/Azeez_resume_${theme}.pdf"
            if [ ! -f "$FILE" ]; then
              echo "::error::PDF file $FILE not generated!"
              exit 1
            fi
            
            FILE_SIZE=$(stat -c%s "$FILE")
            if [ "$FILE_SIZE" -lt 1000 ]; then
              echo "::error::PDF file $FILE is too small ($FILE_SIZE bytes)."
              exit 1
            fi
            echo "✔ Verified $FILE ($FILE_SIZE bytes)"
          done

      - name: Prepare Website
        run: |
          # Copy the custom website files to the output directory
          cp -r html/* output/
          
          # Set the default resume (Minimal/ATS) as the main download
          cp output/Azeez_resume_minimal.pdf output/Azeez_resume.pdf
          
          # Verify the final artifact structure
          ls -R output/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4