name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: src
          root_file: resume.tex
          # Run chktex to find common errors, but don't fail the build on warnings (exit 0)
          # We just want to see the output in the logs.
          # -q = quiet, -n22 = ignore warning 22 (comment in label), etc.
          # Just running basic check here.
          args: -chktex -interaction=nonstopmode

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: src
          root_file: resume.tex
          # -pdf ensures latexmk is used (handling bibtex/refs automatically)
          # -file-line-error helps with debugging
          # -interaction=nonstopmode prevents hanging on errors
          args: -pdf -file-line-error -interaction=nonstopmode -output-directory=../output

      - name: Verify PDF Generation
        run: |
          if [ ! -f "output/resume.pdf" ]; then
            echo "::error::PDF file not generated!"
            exit 1
          fi
          
          FILE_SIZE=$(stat -c%s "output/resume.pdf")
          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "::error::PDF file is too small ($FILE_SIZE bytes), likely corrupted."
            exit 1
          fi
          echo "PDF generated successfully ($FILE_SIZE bytes)."

      - name: Prepare Website
        run: |
          # Rename the PDF to match the HTML link
          mv output/resume.pdf output/Azeez_resume.pdf
          
          # Copy the custom website files to the output directory
          cp -r html/* output/
          
          # Verify the final artifact structure
          ls -R output/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
